let FILTER = "all";
function bj(d){return new Date(d).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai"});}
function bjDate(d){return new Date(d).toLocaleDateString("zh-CN",{timeZone:"Asia/Shanghai",month:"2-digit",day:"2-digit"});}
function bjTime(d){return new Date(d).toLocaleTimeString("zh-CN",{timeZone:"Asia/Shanghai",hour:"2-digit",minute:"2-digit"});}
const ini=s=>(s||"").trim()[0]||"";
const badge=(n,logo,acm)=>`<span class="badge${acm?" acm":""}"><span class="ini">${ini(n)}</span><img src="${logo}" onload="this.parentElement.classList.add('ld')" onerror="this.remove()"></span>`;
function card(e){
  const opp=e.opp, mil=e.milan;
  const home = e.isHome ? mil : opp;
  const away = e.isHome ? opp : mil;
  const homeIsMilan = e.isHome;
  const awayIsMilan = !e.isHome;
  let mid;
  if(e.state==="post"){
    const r=e.milan.winner?"W":(e.opp.winner?"L":"D");
    const rt={W:"胜",L:"负",D:"平"}[r];
    mid=`<div class="score">${e.milan.score??"-"}-${e.opp.score??"-"}</div><span class="res ${r}">${rt}</span>`;
  } else if(e.state==="in"){
    mid=`<div class="score">${e.milan.score??"0"}-${e.opp.score??"0"}</div><span class="res LIVE">进行中</span>`;
  } else {
    mid=`<div class="vs">VS</div>`;
  }
  const exp = e.state==="post" ? `<button class="exp" onclick="toggleDet('${e.id}')">赛况/统计 ▾</button>` : "";
  const det  = e.state==="post" ? `<div class="det" id="det-${e.id}" style="display:none"></div>` : "";
  return `<div class="card">
    <div class="when"><div class="d">${bjDate(e.date)}</div><div class="t">${bjTime(e.date)}</div><div class="c">${e.competition}${e.round? " · 第"+e.round+"轮":""}</div></div>
    <div class="hteam"><span class="nm">${home.name}</span>${badge(home.name,home.logo,homeIsMilan)}</div>
    <div class="mid">${mid}</div>
    <div class="ateam">${badge(away.name,away.logo,awayIsMilan)}<span class="nm">${away.name}</span></div>
    <div class="meta"><span><a href="${e.detail||'#'}" target="_blank">直播吧详情</a></span>${exp}</div>
    ${det}
  </div>`;
}
function render(){
  const list=document.getElementById("list");
  const nb=document.getElementById("nextBox");
  nb.style.display="none";
  if(FILTER==="standings"){renderStandings();return;}
  if(FILTER==="squad"){renderSquad();return;}
  if(FILTER==="analysis"){renderAnalysis();return;}
  const ev=DATA.schedule.events.slice();
  const results=ev.filter(e=>e.state==="post").sort((a,b)=>new Date(b.date)-new Date(a.date));
  const fixtures=ev.filter(e=>e.state!=="post").sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(fixtures.length){
    const k=fixtures[0];
    nb.style.display="block";
    nb.innerHTML=`<div class="lbl">下一场 · ${k.competition}</div><div class="cd">${k.isHome?"主":"客"} vs ${k.opp.name}</div><div class="meta" style="margin-top:4px">${bj(k.date)} 开球</div>`;
  } else { nb.style.display="none"; }
  let html="";
  if(FILTER==="all"||FILTER==="pre"){
    if(fixtures.length){html+=`<div class="seg">赛程</div>`+fixtures.map(card).join("");}
    else if(FILTER==="pre") html+=`<div class="empty">暂无未赛场次</div>`;
  }
  if(FILTER==="all"||FILTER==="post"){
    if(results.length){html+=`<div class="seg">赛果</div>`+results.map(card).join("");}
    else if(FILTER==="post") html+=`<div class="empty">暂无赛果</div>`;
  }
  if(!html) html=`<div class="empty">暂无数据</div>`;
  list.innerHTML=html;
}
function renderStandings(){
  const data=DATA.standings.entries;
  if(!data.length){document.getElementById("list").innerHTML='<div class="empty">暂无积分数据</div>';return;}
  const rows=data.map(e=>`<tr class="${e.isMilan?'me':''}">
    <td class="rk">${e.rank}</td>
    <td class="tm">${badge(e.name,e.logo,e.isMilan)}${e.name}</td>
    <td>${e.P}</td>
    <td class="wdl">${e.W}/${e.D}/${e.L}</td>
    <td class="gl">${e.GF}/${e.GA}</td>
    <td class="pts">${e.Pts}</td></tr>`).join("");
  document.getElementById("list").innerHTML=`<div class="seg">意甲积分榜 2026-2027 · 数据：腾讯体育</div>
    <div class="tblwrap"><table class="st"><thead><tr><th>#</th><th>球队</th><th>场</th><th>胜/平/负</th><th>进/失</th><th>积分</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderSquad(){
  const g=DATA.squad.goals||{}, a=DATA.squad.assists||{};
  const gA=Object.entries(g).sort((x,y)=>y[1]-x[1]);
  const aA=Object.entries(a).sort((x,y)=>y[1]-x[1]);
  const maxG=Math.max(1,...gA.map(x=>x[1])), maxA=Math.max(1,...aA.map(x=>x[1]));

  document.getElementById("list").innerHTML=`<div class="seg">AC米兰 队内榜 2026-2027（按已赛场次进球/助攻事件聚合）</div>
    <div class="squad"><div class="panel"><div class="ph">⚽ 射手榜</div>${lb(gA,maxG)}</div><div class="panel"><div class="ph">🅰️ 助攻榜</div>${lb(aA,maxA)}</div></div>`;
}
function renderAnalysis(){
  const an = DATA.analysis || {};
  if(!an.kings || !an.kings.length){ document.getElementById("list").innerHTML='<div class="empty">暂无数据</div>'; return; }
  const ov = an.overview || {};
  let ovHtml = "";
  if(ov.rank){
    const rec = ov.records || {};
    const WDL = {"胜":"W","负":"L","平":"D"};
    const last5 = (ov.last5||[]).map(x=>WDL[x]||"D").join(" ");
    ovHtml = `<div class="ov">
      <div class="o"><b>${ov.rank}</b><span>${ov.rankDesc||"排名"}</span></div>
      <div class="o"><b>${(rec.win??0)}-${(rec.draw??0)}-${(rec.lose??0)}</b><span>胜-平-负</span></div>

    </div>`;
  }
  let basicHtml="";
  const basics=an.basics||[];
  if(basics.length){
    const brows=basics.map(b=>`<tr><td>${b.name}</td><td class="bval">${b.value ?? "-"}</td><td>${b.avg ?? "-"}</td><td class="brk">${b.rank?("#"+b.rank):"—"}</td></tr>`).join("");

  const rows = an.kings.map(k=>`<div class="krow"><span class="kstat">${k.stat}</span>${k.players.map(p=>`<span class="pchip">${p}</span>`).join("")}<span class="kval">${k.value ?? ""}</span></div>`).join("");
  const kingHtml=`<div class="seg" style="margin-top:18px">队内数据 · 2026-2027 · 数据：腾讯体育</div>${ovHtml}<div class="king"><div class="kh">${an.title||"队内数据王"}</div>${rows}</div>`;
  document.getElementById("list").innerHTML=basicHtml+kingHtml;
}

        +'<span style="flex:1;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">'+x.left+'</span>'
        +'<span style="width:60px;text-align:center;color:var(--mut);flex:none">'+x.title+'</span>'
        +'<span style="flex:1;text-align:left;font-weight:700;font-variant-numeric:tabular-nums">'+x.right+'</span></div>';
    }).join("");
    stHtml='<div class="seg" style="margin-top:10px">技术统计</div><div style="font-size:11px;margin-bottom:2px">'+st.left+' vs '+st.right+'</div>'+rows;
  }
  el.innerHTML='<div class="seg">赛况</div>'+evHtml+stHtml;
  el.dataset.loaded="1"; el.style.display="block";
};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");FILTER=t.dataset.f;render();});
document.getElementById("upd").textContent = "数据更新于 " + (DATA.buildTime || "");
render();
</script>
</body></html>
